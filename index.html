<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <title>vocab vibe ✨</title>
  <style>
    :root {
      --bg: #eef3ff;
      --bg-2: #f8efff;
      --surface: rgba(255,255,255,.46);
      --surface-strong: rgba(255,255,255,.72);
      --surface-2: rgba(255,255,255,.30);
      --text: #201f33;
      --muted: #6e7190;
      --line: rgba(255,255,255,.48);
      --line-2: rgba(117, 122, 163, .18);
      --accent: #7b6cff;
      --accent-soft: rgba(123,108,255,.14);
      --accent-2: #49b7ff;
      --good: #12815c;
      --good-soft: rgba(18,129,92,.13);
      --warn: #b06a00;
      --warn-soft: rgba(255,190,77,.16);
      --danger: #c8487d;
      --danger-soft: rgba(200,72,125,.14);
      --shadow: 0 20px 60px rgba(65, 70, 120, 0.12);
      --glow: inset 0 1px 0 rgba(255,255,255,.65), 0 1px 0 rgba(255,255,255,.25);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --sidebar: 262px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(111, 196, 255, .42), transparent 22%), radial-gradient(circle at top right, rgba(178, 127, 255, .28), transparent 24%), linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }



    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(18px);
      z-index: 0;
      opacity: .9;
    }

    body::before {
      width: 340px;
      height: 340px;
      left: -80px;
      top: 90px;
      background: radial-gradient(circle at 30% 30%, rgba(120, 209, 255, .72), rgba(120, 209, 255, 0) 70%);
    }

    body::after {
      width: 420px;
      height: 420px;
      right: -110px;
      top: 120px;
      background: radial-gradient(circle at 40% 40%, rgba(191, 129, 255, .56), rgba(191, 129, 255, 0) 72%);
    }

    button, input, textarea, select, summary { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .app-shell { min-height: 100vh; position: relative; z-index: 1; }

    .sidebar {
      width: var(--sidebar);
      position: fixed;
      inset: 0 auto 0 0;
      padding: 22px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.46), rgba(255,255,255,.28));
      border-right: 1px solid var(--line);
      backdrop-filter: blur(26px) saturate(150%);
      box-shadow: var(--shadow), var(--glow);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 19px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(123,108,255,.95), rgba(73,183,255,.92));
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(93,95,194,.28);
      font-size: 19px;
    }

    .nav { display: grid; gap: 6px; }
    .nav-label {
      text-transform: lowercase;
      padding: 2px 12px 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .12em;
      font-weight: 700;
    }

    .nav-btn {
      text-transform: lowercase;
      border: 0;
      background: transparent;
      color: #555b66;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 13px;
      text-align: left;
      font-weight: 600;
      transition: .18s ease;
    }

    .nav-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-btn.active { background: var(--accent-soft); color: #4f42cf; }
    .nav-btn svg { width: 19px; height: 19px; flex: 0 0 19px; }
    .nav-count {
      margin-left: auto;
      min-width: 24px;
      height: 22px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.055);
      border-radius: 999px;
      font-size: 11px;
    }

    .sidebar-note {
      margin-top: auto;
      padding: 15px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.20));
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: var(--glow);
      color: #5e6070;
      font-size: 12px;
      line-height: 1.5;
    }

    .main { margin-left: var(--sidebar); min-height: 100vh; }

    .topbar {
      min-height: 82px;
      padding: 17px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      position: sticky;
      top: 0;
      z-index: 15;
      background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.18));
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 20px;
      margin: 14px 16px 0;
      box-shadow: var(--glow);
    }

    .mobile-menu { display: none; }

    .search-wrap {
      width: min(560px, 100%);
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      width: 18px;
      height: 18px;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #848a96;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.42);
      border-radius: 15px;
      padding: 12px 16px 12px 44px;
      outline: none;
      transition: .18s ease;
      box-shadow: 0 2px 10px rgba(30,35,55,.02);
    }

    .search:focus {
      border-color: #b8b1ff;
      box-shadow: 0 0 0 4px rgba(109,93,252,.10);
    }

    .top-action {
      border: 0;
      background: linear-gradient(135deg, rgba(123,108,255,.95), rgba(73,183,255,.92));
      color: white;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(93,95,194,.28);
      border-radius: 14px;
      padding: 11px 16px;
      font-weight: 650;
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }
    .top-action svg { width: 17px; height: 17px; }

    .content { padding: 10px 30px 42px; max-width: 1480px; margin: 0 auto; }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 10px 0 24px;
    }

    .eyebrow {
      text-transform: lowercase;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .11em;
      margin-bottom: 6px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: clamp(28px, 4vw, 42px); line-height: 1.02; letter-spacing: -.045em; }
    .page-subtitle {
      text-transform: lowercase; margin: 0; color: var(--muted); font-size: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card {
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: var(--shadow), var(--glow);
      background: linear-gradient(180deg, rgba(255,255,255,.36), rgba(255,255,255,.26));
      border: 1px solid rgba(255,255,255,.46);
      backdrop-filter: blur(22px) saturate(160%);
      border-radius: var(--radius-lg);
      padding: 19px;
      box-shadow: 0 10px 35px rgba(40,45,65,.035);
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat-icon { width: 35px; height: 35px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
    .stat-icon svg { width: 17px; height: 17px; }
    .stat-value { font-size: 32px; font-weight: 700; letter-spacing: -.04em; }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,0) 45%);
      pointer-events: none;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.36), rgba(255,255,255,.26));
      border: 1px solid rgba(255,255,255,.46);
      backdrop-filter: blur(22px) saturate(160%);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .library-toolbar {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .result-meta { color: var(--muted); font-size: 13px; }
    .sort-select {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      background: rgba(255,255,255,.55);
      color: #555b66;
      outline: none;
    }

    .entry-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
      padding: 16px;
    }

    .entry-card {
      backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 12px 28px rgba(86, 91, 148, .08), var(--glow);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 17px;
      background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.30));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      transition: .18s ease;
    }

    .entry-card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(45,48,70,.07); }
    .entry-main { min-width: 0; }
    .entry-topline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
    .entry-word { font-weight: 700; font-size: 22px; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .entry-ipa { color: var(--muted); font-size: 13px; }
    .entry-meaning { color: #3f444d; line-height: 1.52; font-size: 14px; margin-bottom: 7px; }
    .entry-thai { font-family: inherit; color: #5c626d; font-size: 13px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .chip { padding: 5px 8px; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.32); color: #646a76; font-weight: 600; }
    .badge { padding: 5px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.learn { color: var(--warn); background: var(--warn-soft); }
    .badge.mastered { color: var(--good); background: var(--good-soft); }

    .entry-side { width: 94px; display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
    .thumb {
      width: 86px;
      height: 86px;
      border-radius: 16px;
      object-fit: cover;
      background: #f1f2f5;
      border: 1px solid var(--line);
    }
    .thumb-placeholder { width: 86px; height: 86px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.24); color: #a3a7b0; border: 1px dashed #d8dae1; }
    .thumb-placeholder svg { width: 24px; height: 24px; }
    .card-actions { display: flex; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.55); color: #646a76; }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); border-color: #ffd2d6; }
    .icon-btn svg { width: 16px; height: 16px; }

    .empty {
      padding: 72px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; }
    .empty-icon svg { width: 25px; height: 25px; }
    .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 5px; }

    .form-shell { padding: 20px; }
    .form-section {
      backdrop-filter: blur(20px) saturate(160%);
      box-shadow: var(--glow); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.30)); }
    .section-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 17px; }
    .section-number { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: #5749dc; font-size: 12px; font-weight: 700; flex: 0 0 30px; }
    .section-head h3 { margin: 1px 0 3px; font-size: 15px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }

    .form-grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 14px; }
    .col-12 { grid-column: span 12; }
    .col-8 { grid-column: span 8; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-3 { grid-column: span 3; }

    .field { min-width: 0; }
    .field label {
      text-transform: lowercase; display: block; font-size: 12px; font-weight: 650; margin: 0 0 7px; color: #505661; }
    .required::after { content: " *"; color: var(--danger); }

    input[type="text"], input[type="url"], textarea, select, .multi-pos summary {
      width: 100%;
      border: 1px solid #dfe2e9;
      background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.30));
      border-radius: 13px;
      padding: 11px 12px;
      outline: none;
      color: var(--text);
      transition: .16s ease;
    }

    textarea { min-height: 106px; resize: vertical; line-height: 1.5; }
    input:focus, textarea:focus, select:focus, .multi-pos[open] summary { border-color: #b8b1ff; box-shadow: 0 0 0 4px rgba(109,93,252,.09); }
    .helper { color: var(--muted); font-size: 11px; margin-top: 6px; }

    .multi-pos { position: relative; }
    .multi-pos summary { list-style: none; cursor: pointer; min-height: 43px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .multi-pos summary::-webkit-details-marker { display: none; }
    .multi-pos summary::after { content: "⌄"; color: #838895; font-size: 16px; }
    .pos-menu { position: absolute; z-index: 8; top: calc(100% + 7px); left: 0; right: 0; background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 16px 40px rgba(30,35,55,.13); max-height: 275px; overflow: auto; }
    .pos-option { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; font-size: 13px; }
    .pos-option:hover { background: var(--surface-2); }
    .pos-option input { accent-color: var(--accent); }

    .drop-zone {
      border: 1.5px dashed #cfd2dc;
      background: rgba(255,255,255,.22);
      border-radius: 17px;
      padding: 24px;
      text-align: center;
      transition: .16s ease;
    }
    .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
    .drop-zone input { display: none; }
    .drop-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 10px; border-radius: 14px; background: rgba(255,255,255,.55); border: 1px solid var(--line); }
    .drop-icon svg { width: 21px; height: 21px; }
    .drop-zone strong { display: block; font-size: 14px; margin-bottom: 4px; }
    .drop-zone span { color: var(--muted); font-size: 12px; }
    .choose-link { color: var(--accent); font-weight: 700; cursor: pointer; }

    .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; margin-top: 12px; }
    .preview-card { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #f4f5f7; }
    .preview-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-remove { position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border: 0; border-radius: 9px; background: rgba(30,31,35,.78); color: white; display: grid; place-items: center; }
    .preview-remove svg { width: 14px; height: 14px; }
    .preview-label { position: absolute; inset: auto 7px 7px; padding: 5px 7px; border-radius: 8px; color: white; background: rgba(30,31,35,.67); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }
    .btn { border: 1px solid var(--line); background: rgba(255,255,255,.55); border-radius: 13px; padding: 11px 16px; font-weight: 650; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { border-color: var(--text); background: var(--text); color: white; min-width: 130px; }
    .btn.primary:hover { background: #31343a; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .import-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .import-drop-zone {
      border: 1.5px dashed rgba(123,108,255,.36);
      background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.18));
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: var(--glow);
      transition: .18s ease;
    }

    .import-drop-zone.dragover {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(123,108,255,.14), rgba(73,183,255,.11));
      transform: translateY(-1px);
    }

    .import-drop-zone input { display: none; }
    .import-file-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(123,108,255,.20), rgba(73,183,255,.16));
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: var(--glow);
      font-size: 27px;
    }
    .import-drop-zone strong { display: block; font-size: 16px; margin-bottom: 5px; }
    .import-drop-zone p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .import-file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 18px;
      background: rgba(255,255,255,.27);
      box-shadow: var(--glow);
    }
    .import-file-main { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .import-file-emoji { font-size: 24px; }
    .import-file-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .import-file-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .mapping-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }
    .mapping-item {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.42);
      background: rgba(255,255,255,.23);
      box-shadow: var(--glow);
    }
    .mapping-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 700;
      color: #555978;
    }
    .mapping-required { color: var(--danger); font-size: 10px; }
    .mapping-item select { padding: 9px 10px; font-size: 12px; }

    .import-settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }

    .preview-shell {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.46);
      background: rgba(255,255,255,.24);
      box-shadow: var(--glow);
    }
    .preview-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 11px;
    }
    .preview-table th, .preview-table td {
      padding: 10px 11px;
      border-bottom: 1px solid rgba(117,122,163,.12);
      border-right: 1px solid rgba(117,122,163,.08);
      text-align: left;
      vertical-align: top;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(247,248,255,.86);
      backdrop-filter: blur(16px);
      color: #555978;
      font-weight: 700;
    }
    .preview-table tr:last-child td { border-bottom: 0; }

    .import-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .import-pill {
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.34);
      border: 1px solid rgba(255,255,255,.46);
      box-shadow: var(--glow);
    }

    .btn.soft {

<script>
  const ICONS = {
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3 3 2-2 4.5 3.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>'
  };

  const POS_OPTIONS = [
    'noun', 'verb', 'adjective', 'adverb', 'pronoun', 'preposition',
    'conjunction', 'determiner', 'interjection', 'auxiliary verb',
    'modal verb', 'phrasal verb', 'phrase', 'idiom', 'collocation', 'other'
  ];

  const ENTRY_TYPES = ['word', 'phrase', 'phrasal verb', 'idiom', 'collocation', 'other'];

  const IMPORT_FIELDS = [
    { key: 'entry', label: 'word / phrase', required: true, aliases: ['word', 'phrase', 'word phrase', 'word/phrase', 'vocab', 'vocabulary', 'term', 'expression', 'entry'] },
    { key: 'entryType', label: 'entry type', aliases: ['entry type', 'type', 'vocab type', 'item type'] },
    { key: 'englishMeaning', label: 'english meaning', aliases: ['english meaning', 'meaning english', 'meaning en', 'definition', 'english definition', 'meaning'] },
    { key: 'thaiMeaning', label: 'thai meaning', aliases: ['thai meaning', 'meaning thai', 'meaning th', 'thai', 'คำแปล', 'ความหมาย'] },
    { key: 'ipa', label: 'ipa', aliases: ['ipa', 'phonetic', 'phonetics', 'pronunciation'] },
    { key: 'thaiIpa', label: 'ipa thai / คำอ่านไทย', aliases: ['thai ipa', 'ipa thai', 'thai pronunciation', 'คำอ่าน', 'คำอ่านไทย'] },
    { key: 'pos', label: 'part of speech', aliases: ['part of speech', 'pos', 'word class', 'grammar'] },
    { key: 'wordFamily', label: 'word family', aliases: ['word family', 'related word family', 'family', 'word forms'] },
    { key: 'relatedPhrases', label: 'related phrases / collocations', aliases: ['related phrases', 'phrases', 'collocations', 'related phrases collocations'] },
    { key: 'synonyms', label: 'similar phrases / synonyms', aliases: ['synonyms', 'similar phrases', 'similar words', 'alternatives'] },
    { key: 'examples', label: 'sentence examples', aliases: ['example', 'examples', 'sentence example', 'sentence examples', 'example sentence', 'example sentences'] },
    { key: 'notes', label: 'notes', aliases: ['note', 'notes', 'remark', 'remarks'] },
    { key: 'source', label: 'source', aliases: ['source', 'where found', 'origin'] },
    { key: 'sourceUrl', label: 'source url', aliases: ['source url', 'url', 'link', 'source link'] },
    { key: 'status', label: 'status', aliases: ['status', 'learning status', 'progress'] }
  ];

  const state = {
    entries: [],
    view: 'all',
    editingId: null,
    pendingImages: [],
    sort: 'updated-desc',
    importWorkbook: null,
    importFileName: '',
    importSheetName: '',
    importHeaders: [],
    importRows: [],
    importMapping: {}
  };

  document.addEventListener('DOMContentLoaded', bootApp);
  document.addEventListener('click', (event) => {
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 780 && sidebar.classList.contains('open') && !sidebar.contains(event.target) && !event.target.closest('.mobile-menu')) {
      sidebar.classList.remove('open');
    }
  });

  const DEFAULT_API_URL = '';
  const API_URL_STORAGE_KEY = 'vocabVibeApiUrl';

  function getApiUrl() {
    return String(localStorage.getItem(API_URL_STORAGE_KEY) || DEFAULT_API_URL || '').trim();
  }

  function normalizeApiUrl(url) {
    return String(url || '').trim().replace(/\/+$/, '');
  }

  async function bootApp() {
    const apiUrl = getApiUrl();
    if (!apiUrl) {
      setLoading(false);
      renderApiSetup();
      return;
    }
    await loadData();
  }

  async function serverCall(functionName, ...args) {
    const apiUrl = getApiUrl();
    if (!apiUrl) {
      renderApiSetup();
      throw new Error('apps script api url is not connected yet.');
    }

    let response;
    try {
      response = await fetch(apiUrl, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        cache: 'no-store',
        headers: {
          // text/plain keeps this a simple cross-origin request and avoids an OPTIONS preflight.
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: functionName,
          args: args
        })
      });
    } catch (error) {
      throw new Error('could not reach apps script. check the /exec url and deployment access.');
    }

    const raw = await response.text();
    let result;

    try {
      result = JSON.parse(raw);
    } catch (error) {
      throw new Error('apps script returned a non-json response. make sure you are using the deployed /exec url, not /dev.');
    }

    if (!response.ok || !result.ok) {
      throw new Error(result && result.error ? result.error : `request failed (${response.status})`);
    }

    return result.data;
  }

  function renderApiSetup(message = '') {
    state.view = 'api';
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    const saved = getApiUrl();

    document.getElementById('content').innerHTML = `
      <section class="page-head">
        <div>
          <div class="eyebrow">github ↔ apps script</div>
          <h1>connect your sheet</h1>
          <p class="page-subtitle">paste the apps script web app <strong>/exec</strong> url once. this github page will remember it in this browser.</p>
        </div>
      </section>

      <section class="panel" style="max-width:820px; margin:0 auto;">
        <div class="form-shell">
          <section class="form-section" style="margin-bottom:0;">
            ${sectionHead('1', 'apps script api', 'deploy code.gs as a web app first, then paste the deployed url below.')}
            <div class="form-grid">
              <div class="field col-12">
                <label class="required">web app url</label>
                <input id="apiUrlInput" type="url" value="${escapeAttr(saved)}" placeholder="https://script.google.com/macros/s/.../exec">
                <div class="helper">use the url ending in <strong>/exec</strong>. do not use the apps script editor url.</div>
              </div>
            </div>

            ${message ? `<div style="margin-top:14px; color:var(--danger); font-size:13px; line-height:1.5;">${escapeHtml(message)}</div>` : ''}

            <div class="form-actions" style="margin-top:18px;">
              ${saved ? `<button class="btn" type="button" onclick="disconnectApi()">forget url</button>` : ''}
              <button class="btn primary" id="connectApiButton" type="button" onclick="saveAndTestApi()">connect & test</button>
            </div>
          </section>
        </div>
      </section>
    `;
  }

  async function saveAndTestApi() {
    const input = document.getElementById('apiUrlInput');
    const button = document.getElementById('connectApiButton');
    const url = normalizeApiUrl(input ? input.value : '');

    if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(url)) {
      renderApiSetup('that does not look like an apps script /exec web app url.');
      return;
    }

    localStorage.setItem(API_URL_STORAGE_KEY, url);
    if (button) {
      button.disabled = true;
      button.textContent = 'testing...';
    }

    try {
      const test = await serverCall('ping');
      if (!test || !test.connected) throw new Error('unexpected api response.');
      toast('connected to google sheets ✨');
      state.view = 'all';
      await loadData();
      setView('all');
    } catch (error) {
      renderApiSetup(error.message);
    }
  }

  function disconnectApi() {
    localStorage.removeItem(API_URL_STORAGE_KEY);
    state.entries = [];
    updateCounts();
    renderApiSetup();
  }

  function openApiSettings() {
    closeSidebar();
    renderApiSetup();
  }

  async function loadData(showLoader = true) {
    if (showLoader) setLoading(true);
    try {
      const data = await serverCall('getInitialData');
      state.entries = data.entries || [];
      updateCounts();
      renderCurrentView();
    } catch (error) {
      showFatal(error.message);
    } finally {
      setLoading(false);
    }
  }

  function getFilteredEntries() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = [...state.entries];

    if (state.view === 'to-learn') list = list.filter(x => x.status === 'To Learn');
    if (state.view === 'mastered') list = list.filter(x => x.status === 'Mastered');

    if (query) {
      list = list.filter(entry => {
        const haystack = [
          entry.entry, entry.entryType, entry.englishMeaning, entry.thaiMeaning,
          entry.ipa, entry.thaiIpa, (entry.pos || []).join(' '), entry.wordFamily,
          entry.relatedPhrases, entry.synonyms, entry.examples, entry.notes, entry.source
        ].join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }

    list.sort((a, b) => {
      if (state.sort === 'az') return a.entry.localeCompare(b.entry, undefined, { sensitivity: 'base' });
      if (state.sort === 'za') return b.entry.localeCompare(a.entry, undefined, { sensitivity: 'base' });
      if (state.sort === 'created-desc') return String(b.createdAt).localeCompare(String(a.createdAt));
      return String(b.updatedAt).localeCompare(String(a.updatedAt));
    });

    return list;
  }

    }
    const previewRows = state.importRows.slice(0, 8);
    return `

  function handleBulkDragOver(event) {
    event.preventDefault();
    document.getElementById('bulkDropZone')?.classList.add('dragover');
  }

  function handleBulkDragLeave(event) {
    event.preventDefault();
    document.getElementById('bulkDropZone')?.classList.remove('dragover');
  }

  function handleBulkDrop(event) {
    event.preventDefault();
    document.getElementById('bulkDropZone')?.classList.remove('dragover');
    const file = event.dataTransfer.files?.[0];
    if (file) handleBulkFile(file);
  }

  function handleBulkFile(file) {
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      toast('excel reader could not load. refresh the app and try again.', true);
      return;
    }
    const allowed = /\.(xlsx|xls|csv)$/i.test(file.name);
    if (!allowed) {
      toast('please use an xlsx, xls, or csv file.', true);
      return;
    }

    setLoading(true);
    const reader = new FileReader();
    reader.onerror = () => {
      setLoading(false);
      toast('could not read that file.', true);
    };
    reader.onload = event => {
      try {
        state.importWorkbook = XLSX.read(event.target.result, { type: 'array', cellDates: false });
        state.importFileName = file.name;
        const firstSheet = state.importWorkbook.SheetNames[0];
        selectImportSheet(firstSheet, false);
        renderBulkImport();
        toast('file loaded ✨');
      } catch (error) {
        clearImportState();
        toast('could not open that spreadsheet: ' + error.message, true);
      } finally {
        setLoading(false);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function selectImportSheet(sheetName, rerender = true) {
    if (!state.importWorkbook || !state.importWorkbook.Sheets[sheetName]) return;
    state.importSheetName = sheetName;
    const worksheet = state.importWorkbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', raw: false, blankrows: false });
    const usableRows = rows.filter(row => Array.isArray(row) && row.some(cell => String(cell ?? '').trim() !== ''));

    if (!usableRows.length) {
      state.importHeaders = [];
      state.importRows = [];
      state.importMapping = {};
    } else {
      state.importHeaders = usableRows[0].map((header, index) => String(header ?? '').trim() || `column ${index + 1}`);
      state.importRows = usableRows.slice(1).map(row => state.importHeaders.map((_, index) => String(row[index] ?? '').trim()));
      state.importMapping = buildAutoImportMapping();
    }

    if (rerender) renderBulkImport();
  }

  function clearImportState() {
    state.importWorkbook = null;
    state.importFileName = '';
    state.importSheetName = '';
    state.importHeaders = [];
    state.importRows = [];
    state.importMapping = {};
  }

  function clearImportFile() {
    clearImportState();
    renderBulkImport();
  }

  function normalizeHeader(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/[&+]/g, ' and ')
      .replace(/[_\-–—/\\()]+/g, ' ')
      .replace(/[^\p{L}\p{N}\s]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function buildAutoImportMapping() {
    const normalizedHeaders = state.importHeaders.map(normalizeHeader);
    const mapping = {};
    const used = new Set();

    IMPORT_FIELDS.forEach(field => {
      const aliases = [field.label, ...(field.aliases || [])].map(normalizeHeader);
      const index = normalizedHeaders.findIndex((header, idx) => !used.has(idx) && aliases.includes(header));
      mapping[field.key] = index === -1 ? '' : index;
      if (index !== -1) used.add(index);
    });

    IMPORT_FIELDS.forEach(field => {
      if (mapping[field.key] !== '') return;
      const aliases = [field.label, ...(field.aliases || [])]
        .map(normalizeHeader)
        .filter(alias => alias.length >= 5);
      const index = normalizedHeaders.findIndex((header, idx) => {
        if (used.has(idx)) return false;
        return aliases.some(alias => header.includes(alias) || alias.includes(header));
      });
      mapping[field.key] = index === -1 ? '' : index;
      if (index !== -1) used.add(index);
    });

    return mapping;
  }

  function autoMapImportColumns() {
    state.importMapping = buildAutoImportMapping();
    renderBulkImport();
    toast('columns auto-matched ✨');
  }

  function updateImportMapping(key, value) {
    state.importMapping[key] = value === '' ? '' : Number(value);
  }

  function buildImportedObjects() {
    const mappedFields = IMPORT_FIELDS.filter(field => state.importMapping[field.key] !== '' && state.importMapping[field.key] !== undefined).map(field => field.key);
    const rows = state.importRows.map(row => {
      const item = {};
      mappedFields.forEach(key => {
        const index = Number(state.importMapping[key]);
        item[key] = String(row[index] ?? '').trim();
      });
      return item;
    }).filter(item => String(item.entry || '').trim());
    return { rows, mappedFields };
  }

  async function runBulkImport() {
    const entryColumn = state.importMapping.entry;
    if (entryColumn === '' || entryColumn === undefined) {
      toast('map a source column to word / phrase first.', true);
      document.getElementById('map-entry')?.focus();
      return;
    }

    const built = buildImportedObjects();
    if (!built.rows.length) {
      toast('no rows with a word / phrase were found.', true);
      return;
    }

    const button = document.getElementById('bulkImportButton');
    const duplicateMode = document.getElementById('duplicateMode')?.value || 'skip';
    const defaultEntryType = document.getElementById('defaultEntryType')?.value || 'word';
    const defaultStatus = document.getElementById('defaultStatus')?.value || 'To Learn';
    const batchSize = 150;
    const totals = { imported: 0, updated: 0, skipped: 0, invalid: 0 };

    if (button) {
      button.disabled = true;
      button.textContent = 'importing...';
    }
    setLoading(true);

    try {
      for (let start = 0; start < built.rows.length; start += batchSize) {
        const batch = built.rows.slice(start, start + batchSize);
        if (button) button.textContent = `importing ${Math.min(start + batch.length, built.rows.length)}/${built.rows.length}...`;
        const result = await serverCall('bulkImportEntries', {
          rows: batch,
          mappedFields: built.mappedFields,
          duplicateMode,
          defaultEntryType,
          defaultStatus
        });
        Object.keys(totals).forEach(key => totals[key] += Number(result?.[key] || 0));
      }

      clearImportState();
      state.view = 'all';
      await loadData(false);
      setView('all');
      toast(`done ✨ ${totals.imported} added · ${totals.updated} updated · ${totals.skipped} skipped`);
    } catch (error) {
      toast(error.message, true);
      if (button) {
        button.disabled = false;
        button.textContent = `import ${built.rows.length} rows 📥`;
      }
    } finally {
      setLoading(false);
    }
  }

  function downloadImportTemplate() {
    if (typeof XLSX === 'undefined') {
      toast('excel reader could not load. refresh the app and try again.', true);
      return;
    }
    const headers = IMPORT_FIELDS.map(field => field.label);
    const sample = [
      'take for granted', 'phrase', 'to fail to appreciate something because it feels normal', 'เห็นเป็นเรื่องปกติจนไม่เห็นคุณค่า', '/teɪk fə ˈɡrɑːntɪd/', 'เทค เฟอะ แกรน-ทิด',
      'phrase', 'grant (v); granted (adj)', 'take someone for granted', 'underappreciate', 'we often take clean water for granted.', 'common in everyday english', 'article', 'https://example.com', 'To Learn'
    ];
    const worksheet = XLSX.utils.aoa_to_sheet([headers, sample]);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'vocab import');
    XLSX.writeFile(workbook, 'vocab-vibe-import-template.xlsx');
  }

  function renderForm() {
    const entry = state.editingId ? state.entries.find(x => x.id === state.editingId) : null;
    const selectedPos = entry ? entry.pos || [] : [];

    document.getElementById('content').innerHTML = `
      <section class="page-head">
        <div>
          <div class="eyebrow">${entry ? 'edit vocabulary ✍️' : 'new vocabulary ✨'}</div>
          <h1>${entry ? `edit ${escapeHtml(entry.entry)}` : 'add word / phrase'}</h1>
          <p class="page-subtitle">capture the meaning, pronunciation, related language, examples, and visual references.</p>
        </div>
      </section>

      <form class="panel form-shell" id="entryForm" onsubmit="submitEntry(event)">
        <section class="form-section">
          ${sectionHead('1', 'core info ✨', 'the vocabulary item and its main meaning.')}
          <div class="form-grid">
            ${field('word / phrase', 'entry', 'text', entry?.entry || '', 'e.g. take something for granted', 'col-8', true)}
            <div class="field col-4">
              <label>entry type</label>
              <select id="entryType">${ENTRY_TYPES.map(type => `<option value="${escapeAttr(type)}" ${entry?.entryType === type ? 'selected' : ''}>${escapeHtml(type)}</option>`).join('')}</select>
            </div>
            <div class="field col-8">
              <label>part of speech</label>
              <details class="multi-pos" id="posDetails">
                <summary id="posSummary">${selectedPos.length ? escapeHtml(selectedPos.join(', ')) : 'choose one or more'}</summary>
                <div class="pos-menu">
                  ${POS_OPTIONS.map(pos => `<label class="pos-option"><input type="checkbox" name="pos" value="${escapeAttr(pos)}" ${selectedPos.includes(pos) ? 'checked' : ''} onchange="updatePosSummary()"> <span>${escapeHtml(pos)}</span></label>`).join('')}
                </div>
              </details>
            </div>
            <div class="field col-4">
              <label>status</label>
              <select id="status">
                <option value="To Learn" ${!entry || entry.status === 'To Learn' ? 'selected' : ''}>to learn 🧠</option>
                <option value="Mastered" ${entry?.status === 'Mastered' ? 'selected' : ''}>mastered ✅</option>
              </select>
            </div>
            ${textArea('english meaning', 'englishMeaning', entry?.englishMeaning || '', 'write a clear meaning in english.', 'col-6')}
            ${textArea('thai meaning', 'thaiMeaning', entry?.thaiMeaning || '', 'ความหมายภาษาไทย', 'col-6')}
          </div>
        </section>

        <section class="form-section">
          ${sectionHead('2', 'pronunciation 🔊', 'keep standard ipa and your own thai pronunciation cue separately.')}
          <div class="form-grid">
            ${field('ipa', 'ipa', 'text', entry?.ipa || '', '/ɡræntɪd/', 'col-6')}
            ${field('ipa thai / คำอ่านไทย', 'thaiIpa', 'text', entry?.thaiIpa || '', 'แกรน-ทิด', 'col-6')}
          </div>
        </section>

        <section class="form-section">
          ${sectionHead('3', 'connections 🔗', 'save the vocab around the item, not just the item itself.')}
          <div class="form-grid">
            ${textArea('related word family', 'wordFamily', entry?.wordFamily || '', 'grant (v), granted (adj), granting (n)...', 'col-4')}
            ${textArea('related phrases / collocations', 'relatedPhrases', entry?.relatedPhrases || '', 'take for granted; granted that...', 'col-4')}
            ${textArea('similar phrases / synonyms', 'synonyms', entry?.synonyms || '', 'assume; overlook the value of...', 'col-4')}
          </div>
        </section>

        <section class="form-section">
          ${sectionHead('4', 'examples & notes 📝', 'add enough context so you remember how the vocab actually works.')}
          <div class="form-grid">
            ${textArea('sentence examples', 'examples', entry?.examples || '', 'put each example on a new line.', 'col-12')}
            ${textArea('notes', 'notes', entry?.notes || '', 'grammar, register, nuance, common mistakes, memory cues...', 'col-12')}
            ${field('source / where you found it', 'source', 'text', entry?.source || '', 'e.g. reuters article, netflix, class, book...', 'col-6')}
            ${field('source url', 'sourceUrl', 'url', entry?.sourceUrl || '', 'https://...', 'col-6')}
          </div>
        </section>

        <section class="form-section">
          ${sectionHead('5', 'pictures 📸', "add as many visual references as you want. they'll be stored in google drive.")}
          <div class="drop-zone" id="dropZone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
            <input id="imageInput" type="file" accept="image/*" multiple onchange="addPendingImages(this.files)">
            <div class="drop-icon">${ICONS.image}</div>
            <strong>drop pics here or <label class="choose-link" for="imageInput">choose files</label> 📸</strong>
            <span>multiple images are supported. large images are resized before upload.</span>
          </div>
          <div class="image-preview-grid" id="imagePreviewGrid"></div>
        </section>

        <div class="form-actions">
          <button type="button" class="btn" onclick="setView('all')">cancel</button>
          <button type="submit" class="btn primary" id="saveButton">${entry ? 'save changes' : 'save entry'}</button>
        </div>
      </form>
    `;

    renderImagePreviews(entry);
  }

  function sectionHead(number, title, subtitle) {
    return `<div class="section-head"><div class="section-number">${number}</div><div><h3>${title}</h3><p>${subtitle}</p></div></div>`;
  }

  function field(label, id, type, value, placeholder, col, required = false) {
    return `<div class="field ${col}"><label class="${required ? 'required' : ''}">${label}</label><input id="${id}" type="${type}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}" ${required ? 'required' : ''}></div>`;
  }

  function textArea(label, id, value, placeholder, col) {
    return `<div class="field ${col}"><label>${label}</label><textarea id="${id}" placeholder="${escapeAttr(placeholder)}">${escapeHtml(value)}</textarea></div>`;
  }

  function updatePosSummary() {
    const checked = [...document.querySelectorAll('input[name="pos"]:checked')].map(x => x.value);
    document.getElementById('posSummary').textContent = checked.length ? checked.join(', ') : 'choose one or more';
  }

  function handleDragOver(event) {
    event.preventDefault();
    document.getElementById('dropZone').classList.add('dragover');
  }

  function handleDragLeave(event) {
    event.preventDefault();
    document.getElementById('dropZone').classList.remove('dragover');
  }

  function handleDrop(event) {
    event.preventDefault();
    document.getElementById('dropZone').classList.remove('dragover');
    addPendingImages(event.dataTransfer.files);
  }

  function addPendingImages(fileList) {
    const files = [...fileList].filter(file => file.type.startsWith('image/'));
    files.forEach(file => {
      state.pendingImages.push({
        tempId: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        file,
        previewUrl: URL.createObjectURL(file)
      });
    });
    const entry = state.editingId ? state.entries.find(x => x.id === state.editingId) : null;
    renderImagePreviews(entry);
    document.getElementById('imageInput').value = '';
  }

  function renderImagePreviews(entry) {
    const grid = document.getElementById('imagePreviewGrid');
    if (!grid) return;

    const existing = (entry?.images || []).map(image => `
      <div class="preview-card">
        <img src="${escapeAttr(image.thumbnailUrl)}" alt="">
        <button type="button" class="preview-remove" title="remove image" onclick="removeExistingImage('${escapeJsString(image.imageId)}')">${ICONS.close}</button>
        <div class="preview-label">saved</div>
      </div>
    `).join('');

    const pending = state.pendingImages.map(item => `
      <div class="preview-card">
        <img src="${escapeAttr(item.previewUrl)}" alt="">
        <button type="button" class="preview-remove" title="remove image" onclick="removePendingImage('${escapeJsString(item.tempId)}')">${ICONS.close}</button>
        <div class="preview-label">new</div>
      </div>
    `).join('');

    grid.innerHTML = existing + pending;
  }

  function removePendingImage(tempId) {
    const item = state.pendingImages.find(x => x.tempId === tempId);
    if (item) URL.revokeObjectURL(item.previewUrl);
    state.pendingImages = state.pendingImages.filter(x => x.tempId !== tempId);
    const entry = state.editingId ? state.entries.find(x => x.id === state.editingId) : null;
    renderImagePreviews(entry);
  }

  async function removeExistingImage(imageId) {
    if (!confirm('remove this picture from the vocab entry?')) return;
    setLoading(true);
    try {
      await serverCall('removeImage', imageId);
      await loadData(false);
      const entry = state.editingId ? state.entries.find(x => x.id === state.editingId) : null;
      renderImagePreviews(entry);
      toast('picture removed 🗑️');
    } catch (error) {
      toast(error.message, true);
    } finally {
      setLoading(false);
    }
  }

  async function submitEntry(event) {
    event.preventDefault();
    const saveButton = document.getElementById('saveButton');
    saveButton.disabled = true;
    saveButton.textContent = state.pendingImages.length ? 'saving & uploading...' : 'saving...';

    const payload = {
      id: state.editingId || '',
      entry: value('entry'),
      entryType: value('entryType'),
      englishMeaning: value('englishMeaning'),
      thaiMeaning: value('thaiMeaning'),
      ipa: value('ipa'),
      thaiIpa: value('thaiIpa'),
      pos: [...document.querySelectorAll('input[name="pos"]:checked')].map(x => x.value),
      wordFamily: value('wordFamily'),
      relatedPhrases: value('relatedPhrases'),
      synonyms: value('synonyms'),
      examples: value('examples'),
      notes: value('notes'),
      source: value('source'),
      sourceUrl: value('sourceUrl'),
      status: value('status')
    };

    try {
      const saved = await serverCall('saveEntry', payload);

      for (let i = 0; i < state.pendingImages.length; i++) {
        saveButton.textContent = `uploading ${i + 1}/${state.pendingImages.length}...`;
        const prepared = await prepareImage(state.pendingImages[i].file);
        await serverCall('uploadImage', saved.id, prepared.dataUrl, prepared.fileName);
      }

      state.pendingImages.forEach(item => URL.revokeObjectURL(item.previewUrl));
      state.pendingImages = [];
      state.editingId = null;
      state.view = payload.status === 'Mastered' ? 'mastered' : 'all';
      await loadData(false);
      setView(state.view);
      toast(payload.id ? 'entry updated ✨' : 'entry saved ✨');
    } catch (error) {
      toast(error.message, true);
      saveButton.disabled = false;
      saveButton.textContent = state.editingId ? 'save changes' : 'save entry';
    }
  }

  function prepareImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('could not read ' + file.name));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('could not process ' + file.name));
        img.onload = () => {
          const maxSide = 1600;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const width = Math.max(1, Math.round(img.width * scale));
          const height = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.86);
          const baseName = file.name.replace(/\.[^.]+$/, '').slice(0, 100) || 'vocab-image';
          resolve({ dataUrl, fileName: baseName + '.jpg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function confirmDelete(id) {
    const entry = state.entries.find(x => x.id === id);
    if (!entry) return;
    if (!confirm(`delete “${entry.entry}” and all of its pictures?`)) return;

    setLoading(true);
    try {
      await serverCall('deleteEntry', id);
      await loadData(false);
      toast('entry deleted 🫠');
    } catch (error) {
      toast(error.message, true);
    } finally {
      setLoading(false);
    }
  }

  function openDetails(id) {
    const entry = state.entries.find(x => x.id === id);
    if (!entry) return;

    const detailRows = [
      ['english meaning', entry.englishMeaning],
      ['thai meaning', entry.thaiMeaning],
      ['ipa', [entry.ipa, entry.thaiIpa].filter(Boolean).join(' · ')],
      ['part of speech', (entry.pos || []).join(', ')],
      ['word family', entry.wordFamily],
      ['related phrases / collocations', entry.relatedPhrases],
      ['similar phrases / synonyms', entry.synonyms],
      ['example sentences', entry.examples],
      ['notes', entry.notes],
      ['source', entry.source],
      ['source url', entry.sourceUrl]
    ].filter(row => row[1]);

    document.getElementById('modalCard').innerHTML = `
      <div class="modal-head">
        <div>
          <div class="modal-title">${escapeHtml(entry.entry)}</div>
          <div class="chips"><span class="badge ${entry.status === 'Mastered' ? 'mastered' : 'learn'}">${escapeHtml(String(entry.status || '').toLowerCase())}</span>${entry.entryType ? `<span class="chip">${escapeHtml(entry.entryType)}</span>` : ''}</div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="editEntry('${escapeJsString(entry.id)}')">${ICONS.edit}</button>
          <button class="icon-btn" onclick="closeModal()">${ICONS.close}</button>
        </div>
      </div>
      <div class="modal-body">
        ${detailRows.map(([label, text]) => `<div class="detail-row"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${label === 'source url' ? `<a href="${escapeAttr(text)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>` : escapeHtml(text)}</div></div>`).join('')}
        ${entry.images?.length ? `<div class="detail-row"><div class="detail-label">pictures 📸</div><div class="modal-images">${entry.images.map(image => `<a href="${escapeAttr(image.driveUrl)}" target="_blank" rel="noopener noreferrer"><img src="${escapeAttr(image.thumbnailUrl)}" alt=""></a>`).join('')}</div></div>` : ''}
        <div class="detail-row"><div class="detail-label">added / updated</div><div class="detail-value">${escapeHtml(entry.createdAt)} · ${escapeHtml(entry.updatedAt)}</div></div>
      </div>
    `;
    document.getElementById('detailModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('detailModal').classList.remove('open');
  }

  function closeModalFromBackdrop(event) {
    if (event.target.id === 'detailModal') closeModal();
  }

  function updateCounts() {
    document.getElementById('count-all').textContent = state.entries.length;
    document.getElementById('count-learn').textContent = state.entries.filter(x => x.status === 'To Learn').length;
    document.getElementById('count-mastered').textContent = state.entries.filter(x => x.status === 'Mastered').length;
  }

  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
  function value(id) { return (document.getElementById(id)?.value || '').trim(); }
  function setLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

  function toast(message, isError = false) {
    const wrap = document.getElementById('toastWrap');
    const item = document.createElement('div');
    item.className = 'toast' + (isError ? ' error' : '');
    item.textContent = message;
    wrap.appendChild(item);
    setTimeout(() => item.remove(), 3400);
  }

  function showFatal(message) {
    renderApiSetup(message || 'the github page could not reach the apps script api.');
  }

  function truncate(text, max) {
    const s = String(text || '');
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeAttr(value) { return escapeHtml(value); }

  function escapeJsString(value) {
    return String(value == null ? '' : value)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '\\r')
      .replace(/\n/g, '\\n')
      .replace(/</g, '\\x3C')
      .replace(/>/g, '\\x3E');
  }
</script>
</body>
